    <script>
      (() => {
        const owners = new Set();
        const sync = () => {
          const locked = owners.size > 0;
          document.documentElement.classList.toggle("is-scroll-locked", locked);
          document.body?.classList.toggle("is-scroll-locked", locked);
        };
        window.PortfolioScrollLock = Object.freeze({
          lock(owner = "anonymous") { owners.add(owner); sync(); },
          unlock(owner = "anonymous") { owners.delete(owner); sync(); },
          clear() { owners.clear(); sync(); },
          isLocked() { return owners.size > 0; },
        });
        document.addEventListener("DOMContentLoaded", () => {
          sync();
          const skipLink = document.querySelector(".skip-link");
          const main = document.getElementById("main-content");
          skipLink?.addEventListener("click", () => {
            requestAnimationFrame(() => main?.focus({ preventScroll: true }));
          });
        }, { once: true });
      })();
    </script>
